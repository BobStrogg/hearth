name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Least privilege: read-only token for every job.
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.23.4, 24.22.1]   # oldest patched release of each supported LTS line
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: service install (Linux systemd --user)
        if: runner.os == 'Linux'
        run: |
          export HEARTH_HOME="$HOME/.hearth-ci" HEARTH_DATA_DIR="$HOME/.hearth-ci" HEARTH_PORT=17682 HEARTH_PASSWORD=off HEARTH_IDENTITY=single:ci
          node dist/main.js service install --port 17682
          curl -fs http://127.0.0.1:17682/healthz
          node dist/main.js doctor --offline
          node dist/main.js service uninstall
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: npm ci
      - run: npm test
        continue-on-error: true
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists a PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
