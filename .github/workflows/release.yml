name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-14, target: darwin-arm64 }
          - { os: windows-latest, target: win-x64 }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
        if: runner.os != 'Windows'
      - run: npm run build:sea
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: build/hearth-*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Build npm package
        run: |
          npm pack
          test -f "hearth-acp-${GITHUB_REF_NAME#v}.tgz"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries and checksums
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist-rel
          find artifacts -type f -name 'hearth-*' -exec cp {} dist-rel/ \;
          cp "hearth-acp-${VERSION}.tgz" dist-rel/
          (cd dist-rel && sha256sum * > SHA256SUMS)
          cat dist-rel/SHA256SUMS
      - name: Publish to npm
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then echo "NPM_TOKEN not set: skipping npm publish"; exit 0; fi
          npm publish --provenance --access public
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-rel/*
      - name: Bump Homebrew tap
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then echo "HOMEBREW_TAP_TOKEN not set: skipping tap bump"; exit 0; fi
          VERSION=${GITHUB_REF_NAME#v}
          SHA=$(awk '/hearth-acp-'"${VERSION}"'\.tgz/{print $1}' dist-rel/SHA256SUMS)
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/BobStrogg/homebrew-hearth.git" tap
          cat > tap/Formula/hearth.rb <<RB
          class Hearth < Formula
            desc "Web UI for ACP coding agents"
            homepage "https://github.com/BobStrogg/hearth"
            url "https://registry.npmjs.org/hearth-acp/-/hearth-acp-${VERSION}.tgz"
            sha256 "${SHA}"
            license "MIT"
            depends_on "node"
            def install
              system "npm", "install", "-g", "--prefix=#{libexec}", cached_download
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end
            service do
              run [opt_bin/"hearth", "serve"]
              keep_alive true
              working_dir HOMEBREW_PREFIX
              log_path var/"log/hearth.log"
              error_log_path var/"log/hearth.log"
              environment_variables PATH: std_service_path_env, HEARTH_SERVICE: "brew"
            end
            test do
              assert_match version.to_s, shell_output("#{bin}/hearth --version")
            end
          end
          RB
          sed -i 's/^          //' tap/Formula/hearth.rb
          cd tap && git config user.name "hearth-release" && git config user.email "hearth-release@users.noreply.github.com"
          cd tap && git add Formula/hearth.rb && git commit -m "hearth ${VERSION}" && git push
